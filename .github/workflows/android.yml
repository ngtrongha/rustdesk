name: Build RustDesk Android

on:
  workflow_dispatch:
    inputs:
      target_abi:
        description: 'Kiến trúc CPU'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      build_type:
        description: 'Loại bản dựng'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"

jobs:
  build-android:
    name: Build Android APK (${{ inputs.target_abi }})
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc git g++ llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config libclang-dev libgtk-3-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch Flutter dropdown menu
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [ -f "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" ]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-android-${{ inputs.target_abi }}

      - name: Generate Flutter-Rust Bridge
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart

      - name: Build C/C++ dependencies (vcpkg)
        run: |
          ./flutter/build_android_deps.sh "${{ inputs.target_abi }}"

      - name: Build Rust core library (librustdesk.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          case "${{ inputs.target_abi }}" in
            arm64-v8a)
              rustup target add aarch64-linux-android
              ./flutter/ndk_arm64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
              ;;
            armeabi-v7a)
              rustup target add armv7-linux-androideabi
              ./flutter/ndk_arm.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ./target/armv7-linux-androideabi/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
              ;;
            x86_64)
              rustup target add x86_64-linux-android
              ./flutter/ndk_x64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
              cp ./target/x86_64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/
              ;;
          esac

      - name: Build Flutter APK
        run: |
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Nếu không cấu hình release key thì dùng tạm signing debug để luôn cài được
          if [ -z "${{ env.ANDROID_SIGNING_KEY }}" ]; then
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          fi

          case "${{ inputs.target_abi }}" in
            arm64-v8a)
              FLUTTER_TARGET="android-arm64"
              ;;
            armeabi-v7a)
              FLUTTER_TARGET="android-arm"
              ;;
            x86_64)
              FLUTTER_TARGET="android-x64"
              ;;
          esac

          pushd flutter
          flutter build apk "--${{ inputs.build_type }}" --target-platform "${FLUTTER_TARGET}" --split-per-abi
          popd

          mkdir -p output-apk
          cp flutter/build/app/outputs/flutter-apk/*.apk output-apk/

      - name: Setup Android sign tool
        if: env.ANDROID_SIGNING_KEY != ''
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

      - name: Sign APK with Keystore
        uses: r0adkll/sign-android-release@v1
        if: env.ANDROID_SIGNING_KEY != ''
        id: sign-rustdesk
        with:
          releaseDirectory: output-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        if: env.ANDROID_SIGNING_KEY != ''
        with:
          name: RustDesk-${{ inputs.target_abi }}-${{ inputs.build_type }}-signed
          path: ${{ steps.sign-rustdesk.outputs.signedReleaseFile }}

      - name: Upload Unsigned / Debug-Signed APK
        uses: actions/upload-artifact@v4
        if: env.ANDROID_SIGNING_KEY == ''
        with:
          name: RustDesk-${{ inputs.target_abi }}-${{ inputs.build_type }}
          path: output-apk/*.apk
